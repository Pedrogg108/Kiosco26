<div class="productos-container">

  @for(p of Productos; track p.id){

  <ion-card>

    <img src="{{p.img}}" alt="{{p.alt}}" />

    <ion-card-header>
      <ion-card-title>{{p.nombre}}</ion-card-title>
      <ion-card-subtitle>
        Precio: ${{p.precio}}
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      Here's a small text description for the card content.
    </ion-card-content>

  </ion-card>

  }

</div>
