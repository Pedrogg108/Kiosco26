<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="head">
    <h1 class="titulo">Tu cuenta</h1>
    <span class="subtitulo">Gestiona la información de la cuenta</span>
  </div>

  <div class="cuenta">
    <div class="principal">
      <i class="bi bi-person-circle"></i>
      <span>Nombre de usuario</span>
    </div>
    <div class="editarPerfil">
      <i class="bi bi-person-fill"></i>
      <div>
        <span><strong>Editar Perfil</strong></span>
        <span>Modifica tus datos personales y de contacto</span>
      </div>
      <i class="bi bi-chevron-right"></i>
    </div>

    <div class="cambiarContraseña">
      <i class="bi bi-lock-fill"></i>
      <div>
        <span><strong>Cambiar Contraseña</strong></span>
        <span>Actualiza tu contraseña de acceso</span>
      </div>
      <i class="bi bi-chevron-right"></i>
    </div>

    <div class="cerrarSesion">
      <i class="bi bi-box-arrow-right"></i>
      <div>
        <span><strong>Cerrar Sesión</strong></span>
        <span>Sal de tu cuenta de forma segura</span>
      </div>
      <i class="bi bi-chevron-right"></i>
    </div>

  </div>

</ion-content>
