<ion-header [translucent]="true">

    <ion-title>Más Opciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="head">
    <img src="../../../assets/Imagenes/ionic.png" alt="ionic">
    <div class="titulo">
      <h2><strong>Kiosco del colegio</strong></h2>
      <p>Tu kiosco de siempre, cerca de vos</p>
    </div>
  </div>

  <div class="info">

    <a class="informacion" href="">

        <strong>Informacion</strong><br>

      </p>

      <i class="bi bi-chevron-right"></i>

    <a class="contacto" href="https://www.whatsapp.com/">

      <p>
        <strong>Contacto</strong><br>

      </p>

      <i class="bi bi-chevron-right"></i>

    <a class="redes" href="https://www.instagram.com/">
      <i class="bi bi-instagram"></i>
