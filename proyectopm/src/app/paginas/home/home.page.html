<ion-content>
    <div class="swiper-container">

        <div class="carousel">

            <swiper-container slides-per-view="1" loop="true" pagination="true" navigation="true">

                <swiper-slide>
                    <img src="../../../assets/Imagenes/ionic.png" alt="Imagen 1">
                </swiper-slide>

                <swiper-slide>
                    <img src="../../../assets/Imagenes/ionic.png" alt="Imagen 2">
                </swiper-slide>

                <swiper-slide>
                    <img src="../../../assets/Imagenes/ionic.png" alt="Imagen 3">
                </swiper-slide>

            </swiper-container>

        </div>

        <h2>Categorías</h2>

        <div class="categorias">

            <div class="novedades">
                <i class="bi bi-megaphone-fill"></i>
                <p>Novedades</p>
            </div>

            <div class="sorteos">
                <i class="bi bi-gift-fill"></i>
                <p>Sorteos</p>
            </div>

            <div class="ofertas">
                <i class="bi bi-currency-bitcoin"></i>
                <p>Ofertas</p>
            </div>

            <div class="eventos">
                <i class="bi bi-calendar2"></i>
                <p>Eventos</p>
            </div>

        </div>

        <h2>Productos destacados del Kiosco</h2>
        //cambiar ion card por un for
        <div class="destacados">
            @for(p of Productos.slice(0,8);track p.id){
            <ion-card>

                <img src="{{p.img}}" alt="{{p.alt}}" />

                <ion-card-header>
                    <ion-card-title>{{p.nombre}}</ion-card-title>
                    <ion-card-subtitle>
                        Precio: ${{p.precio}}
                    </ion-card-subtitle>
                </ion-card-header>

                <ion-card-content>
                    Here's a small text description for the card content.
                </ion-card-content>

            </ion-card>
            }



        </div>

    </div>

</ion-content>
