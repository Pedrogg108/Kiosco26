<ion-content>
    <div class="swiper-container"><!--Carrusel de ionic-->

        <div class="carousel">

            <swiper-container slides-per-view="1" loop="true" pagination="true" navigation="true">

                <swiper-slide>
                    <img src="../../../assets/Imagenes/ionic.png" alt="Imagen 1">
                </swiper-slide>

                <swiper-slide>
                    <img src="../../../assets/Imagenes/ionic.png" alt="Imagen 2">
                </swiper-slide>

                <swiper-slide>
                    <img src="../../../assets/Imagenes/ionic.png" alt="Imagen 3">
                </swiper-slide>

            </swiper-container>

        </div>

        <!-- <h2>Categorías</h2> -->
        <h2>Encuentre su producto deseado</h2>
        <ion-searchbar placeholder="Buscar productos..." [debounce]="300"
            (ionInput)="buscarProducto($event)"></ion-searchbar>
        <!--[debounce]="300" : espera 300 milisegundo antes de actualizar la busqueda  -->
        <!--(ionInput): evento de Ionic que ejecuta la funcion "buscarProducto($event)"-->
        <!--($event): le pasa a la funcion informacion sobre el evento, incluido el texto ingresado-->
        <h2>
            {{ textoBusqueda ? 'Resultados de búsqueda' : 'Productos destacados del Kiosco' }}<!--Si se busco algo se muestra el texto 'Resultados de tu busqueda' sino se muestra 'Productos destacados del Kiosco'-->
        </h2>

        <div class="destacados">

            @if (productosFiltrados.length === 0) {<!--Si no se encontro ninguno producto filtrado/buscado entonces muestra el siguente texto-->
            <p class="sin-resultados">
                No se encontraron productos.
            </p>
            } @else {<!--Si se encontraron productos entonces-->
            @for (p of productosFiltrados; track p.id) {<!--Por cada producto filtrado traqueado por su id se mostrara una card -->
            <ion-card>
                <img [src]="p.img" [alt]="p.alt" />

                <ion-card-header>
                    <ion-card-title>{{ p.nombre }}</ion-card-title>

                    <ion-card-subtitle>
                        Precio: ${{ p.precio }}
                    </ion-card-subtitle>
                </ion-card-header>

                <ion-card-content>
                    {{p.alt}}
                </ion-card-content>
            </ion-card>
            }
            }

        </div>


    </div>

</ion-content>
