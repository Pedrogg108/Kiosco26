<ion-header [translucent]="true">
 <img src="assets/Imagenes/logoCet30.png" alt="logoCet30">
 <h1 class="titulo">Kiosco Escolar</h1>

 <button routerLink="/inicioSesion">Iniciar Sesion</button>
 <button routerLink="/registro">Registrarse</button>
</ion-header>

<ion-content [fullscreen]="true">
  <h1>Bienvenido al <span>Kiosco Escolar</span></h1>
  <p>El kiosco escolar, más simple y organizado.
  Descubre ofertas, promociones, consultá y gestioná todo lo que necesitás
  desde un solo lugar.</p>
  <div class="botones">

    <button routerLink="/registro"><i class="bi bi-person-fill"></i>Registrarse</button>

    <button routerLink="/inicioSesion"><i class="bi bi-box-arrow-right"></i>Iniciar Seseión</button>
    
  </div>
</ion-content>
